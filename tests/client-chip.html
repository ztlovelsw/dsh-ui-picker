<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>注释胶囊用例</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px 40px;
    background: #fbfaf7; color: #1d2733;
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lede { margin: 0 0 18px; color: #64748b; font-size: 13px; }
  /* 模拟 DSH 输入框：上方是 dock（注释胶囊），下面是输入框本体 */
  .composer-card {
    max-width: 720px; margin: 0 auto;
    border: 1px solid #e3e0d8; border-radius: 18px; background: #fff;
    box-shadow: 0 18px 40px -28px rgba(15, 23, 42, .35);
    padding: 10px 12px 12px;
  }
  #dock { min-height: 0; }
  #composer {
    margin-top: 8px; min-height: 52px; padding: 8px 4px 0;
    color: #0f172a; white-space: pre-wrap; word-break: break-word;
    font: 400 13.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #composer:empty::before { content: '和 Codex 一起工作'; color: #b8b5ad; }
  #out {
    max-width: 720px; margin: 22px auto 0; padding: 10px 12px;
    border-radius: 10px; background: rgba(15, 23, 42, .93); color: #e2e8f0;
    font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
  }
  #out b { color: #7dd3fc; }
</style>
</head>
<body>
  <h1>注释胶囊用例</h1>
  <p class="lede">页面把两条注释推给桥接 → 输入框上方出现「2 条注释」→ 点开可编辑 / 删除，改动实时回写到输入框文本。</p>

  <div class="composer-card">
    <div id="dock"></div>
    <div id="composer" contenteditable="true"></div>
  </div>

  <pre id="out">running…</pre>

<script type="module">
  // 真实 React（CDN），模拟宿主提供的 require('react')
  const ReactMod = await import('https://esm.sh/react@18');
  const ReactDOMMod = await import('https://esm.sh/react-dom@18/client');
  window.React = ReactMod.default || ReactMod;
  window.ReactDOM = ReactDOMMod.default || ReactDOMMod;

  window.__DSH_UI_PICKER_PORT__ = 17901;

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const out = document.getElementById('out');
  const lines = [];
  let failed = 0;
  const ok = (cond, msg, extra) => {
    lines.push((cond ? 'PASS ' : 'FAIL ') + msg + (extra === undefined ? '' : '  -> ' + extra));
    if (!cond) failed += 1;
  };
  const flush = () => {
    out.innerHTML = lines.map((l) => '<b>' + l.slice(0, 4) + '</b>' + l.slice(4)).join('\n');
  };

  // ---------- 假输入框 facade（对应 DSH 的 conversation.input.for(actx)） ----------
  let draft = '';
  const composerEl = document.getElementById('composer');
  const paintComposer = () => {
    composerEl.textContent = draft;
  };
  const facade = {
    actions: {
      captureInsertion: () => ({ draftRev: 1 }),
      insertText: (text) => {
        draft = draft ? `${draft}\n${text}` : text;
        paintComposer();
        return true;
      },
    },
    setDraft: (text) => {
      draft = text;
      paintComposer();
    },
    state: { getSnapshot: () => ({ draft }) },
  };

  // ---------- 假 ctx + 模块加载器 ----------
  let registered = null;
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      registered = { id, exports: factory((name) => (name === 'react' ? window.React : undefined)) };
    },
  };
  const ctx = {
    slots: {
      inject(name, fn) { fn(); },
      register(options, component) {
        registered.slot = { options, component };
        return () => {};
      },
    },
    sessions: { scope: () => ({ get: () => ({ input: { for: () => facade } }) }) },
    get: () => undefined,
    on: () => () => {},
  };

  // ---------- 载入被测的 client.js（由 tests/chip-bridge.mjs 的静态服务提供） ----------
  const code = await (await fetch(new URL('../client.js', location.href))).text();
  new Function('window', 'document', 'console', code)(window, document, console);
  if (!registered) throw new Error('client.js 未注册模块');
  registered.exports.apply(ctx);
  const { options, component } = registered.slot;
  window.__ReactDOM = window.ReactDOM;

  const props = options.inject('session-1');
  const root = window.ReactDOM.createRoot(document.getElementById('dock'));
  root.render(window.React.createElement(component, props));
  await wait(120);
  flush();

  // ---------- 造两张缩略图（模拟 picker.js 生成的元素小图） ----------
  const thumb = (kind) => {
    const size = 56;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx2 = canvas.getContext('2d');
    if (kind === 'image') {
      const g = ctx2.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#dfe9d8');
      g.addColorStop(0.55, '#cfe0d4');
      g.addColorStop(1, '#eee3c9');
      ctx2.fillStyle = g;
      ctx2.fillRect(0, 0, size, size);
      ctx2.fillStyle = '#e98a5f';
      ctx2.beginPath();
      ctx2.arc(size * 0.72, size * 0.3, size * 0.18, 0, Math.PI * 2);
      ctx2.fill();
    } else {
      ctx2.fillStyle = '#eef2f7';
      ctx2.fillRect(0, 0, size, size);
      ctx2.fillStyle = 'rgba(15,23,42,.10)';
      ctx2.fillRect(0, 0, size, 6);
      ctx2.fillStyle = 'rgba(15,23,42,.16)';
      ctx2.fillRect(8, 19, 34, 4);
      ctx2.fillStyle = 'rgba(15,23,42,.10)';
      ctx2.fillRect(8, 30, 24, 4);
    }
    return canvas.toDataURL('image/png');
  };

  // ---------- 页面推送两条注释 ----------
  const text = [
    '【页面批注】共 2 条',
    '页面：慢骑俱乐部 — http://localhost:5173/',
    '视口：1184 × 805　页面坐标以文档左上角为原点（不随滚动变化）',
    '',
    '1. img.hero-img　页面坐标 (430, 430)　元素内 (53%, 61%)',
    '   批注：这张插画饱和度偏高，降一档',
    '2. div#place-card.card　页面坐标 (300, 604)　元素内 (22%, 50%)',
    '   批注：留白太多，卡片收窄一点',
    '',
    '修改需求：',
  ].join('\n');

  const payload = {
    text,
    meta: {
      kind: 'annotations',
      from: 'localhost:5173',
      page: { title: '慢骑俱乐部', url: 'http://localhost:5173/', w: 1184, h: 805 },
      annotations: [
        { uid: 'a1-1', no: 1, tag: 'img', label: 'img.hero-img', selector: 'img.hero-img', comment: '这张插画饱和度偏高，降一档', thumb: thumb('image'), x: 430, y: 430, offset: { x: 53, y: 61 } },
        { uid: 'a1-2', no: 2, tag: 'div', label: 'div#place-card.card', selector: '#place-card', comment: '留白太多，卡片收窄一点', thumb: thumb('box'), x: 300, y: 604, offset: { x: 22, y: 50 } },
      ],
    },
  };
  await fetch('http://127.0.0.1:17901/push', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(payload),
  });

  // 等轮询把注释接进来并渲染
  const until = async (fn, ms = 4000) => {
    const deadline = Date.now() + ms;
    while (Date.now() < deadline) {
      if (fn()) return true;
      await wait(50);
    }
    return false;
  };

  await until(() => !!document.querySelector('.dsh-anno-pill'));
  ok(!!document.querySelector('.dsh-anno-pill'), '注释胶囊出现在输入框上方');
  ok(document.querySelector('.dsh-anno-pill').textContent.includes('2 条注释'),
    '胶囊显示条数', document.querySelector('.dsh-anno-pill').textContent);
  ok(!document.querySelector('.dsh-anno-card'), '默认收起，不占高度');
  ok(draft.includes('【页面批注】共 2 条'), '注释块写进了输入框草稿');
  ok(draft.includes('批注：这张插画饱和度偏高，降一档'), '草稿里带着注释原文');
  flush();

  // 展开
  document.querySelector('.dsh-anno-pill').click();
  await until(() => !!document.querySelector('.dsh-anno-card'));
  const rows = [...document.querySelectorAll('.dsh-anno-row')];
  ok(rows.length === 2, '点开列出 2 条注释', rows.length);
  const tags = rows.map((r) => r.querySelector('.dsh-anno-tag').textContent);
  ok(tags[0] === 'img' && tags[1] === 'div', '标签徽章是元素标签名', tags.join(','));
  ok(!!rows[0].querySelector('img.dsh-anno-thumb'), '第一条带元素缩略图');
  ok(rows[0].querySelector('.dsh-anno-comment').textContent.includes('饱和度'),
    '第一条显示注释文字');
  ok(rows[0].querySelectorAll('.dsh-anno-icon').length === 2, '每行有编辑 / 删除按钮', rows[0].querySelectorAll('.dsh-anno-icon').length);
  flush();

  // 编辑第一条
  rows[0].querySelectorAll('.dsh-anno-icon')[0].click();
  await until(() => !!document.querySelector('.dsh-anno-input'));
  const input = document.querySelector('.dsh-anno-input');
  ok(!!input, '点铅笔进入编辑态');
  ok(input.value === '这张插画饱和度偏高，降一档', '编辑框带出原注释', input.value);
  input.value = '这张插画饱和度太高，降两档，并把太阳缩小';
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  await wait(120);
  ok(draft.includes('批注：这张插画饱和度太高，降两档，并把太阳缩小'), '编辑后草稿同步更新');
  ok(!draft.includes('降一档'), '旧文字已从草稿移除');
  ok(document.querySelectorAll('.dsh-anno-comment')[0].textContent.includes('降两档'), '卡片显示新注释');
  flush();

  // 删除第二条
  const rows2 = [...document.querySelectorAll('.dsh-anno-row')];
  rows2[1].querySelectorAll('.dsh-anno-icon')[1].click();
  await wait(150);
  ok(document.querySelectorAll('.dsh-anno-row').length === 1, '删掉一条后只剩一条');
  ok(document.querySelector('.dsh-anno-pill').textContent.includes('1 条注释'), '胶囊条数变 1',
    document.querySelector('.dsh-anno-pill').textContent);
  ok(draft.includes('【页面批注】共 1 条'), '草稿里的条数同步');
  ok(!draft.includes('留白太多'), '被删的注释从草稿移除');
  flush();

  // 清空
  document.querySelector('.dsh-anno-clear').click();
  await wait(150);
  ok(!document.querySelector('.dsh-anno-pill'), '清空后胶囊消失');
  ok(!draft.includes('【页面批注】'), '清空后草稿里不再有注释块');
  flush();

  lines.push('');
  lines.push(failed === 0 ? 'ALL PASS' : failed + ' FAILED');
  flush();
  document.title = failed === 0 ? 'PASS' : 'FAIL(' + failed + ')';
  window.__chipReady = true;
</script>
</body>
</html>
