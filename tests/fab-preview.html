<!doctype html><html><head><meta charset="utf-8"><title>fab preview</title>
<style>
body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#f3f6fb,#eef2f8 60%,#f7f9fc);height:420px}
.stage{display:flex;gap:70px;align-items:center;justify-content:center;padding-top:150px}
.cell{display:flex;flex-direction:column;align-items:center;gap:18px}
.cap{font-size:12px;color:#94a3b8}
.wrap{position:relative;width:230px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.35)}
#__dsh_picker_fab__{position:relative!important;right:auto!important;bottom:auto!important}

#__dsh_picker_fab__ {
  position: fixed;
  right: max(18px, env(safe-area-inset-right));
  bottom: max(18px, env(safe-area-inset-bottom));
  z-index: 2147483645;
  display: inline-flex;
  align-items: center;
  height: 33px;
  padding: 0 9px;
  margin: 0;
  border-radius: 999px;
  border: 1px solid rgba(15, 23, 42, .09);
  background: rgba(255, 255, 255, .74);
  -webkit-backdrop-filter: blur(14px) saturate(1.7);
  backdrop-filter: blur(14px) saturate(1.7);
  color: rgba(15, 23, 42, .62);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 18px -6px rgba(15, 23, 42, .18);
  cursor: pointer;
  opacity: .68;
  transform: translateZ(0);
  transition: opacity .2s ease, box-shadow .2s ease, transform .2s cubic-bezier(.2,.8,.2,1),
              background-color .2s ease, border-color .2s ease, color .2s ease;
  font: 500 12.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  letter-spacing: .01em;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#__dsh_picker_fab__:hover {
  opacity: 1;
  transform: translateY(-1px);
  box-shadow: 0 2px 4px rgba(15, 23, 42, .06), 0 14px 32px -10px rgba(15, 23, 42, .28);
}
#__dsh_picker_fab__:active { transform: translateY(0) scale(.97); }
#__dsh_picker_fab__:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .22), 0 6px 18px -6px rgba(15, 23, 42, .2);
}
#__dsh_picker_fab__ svg { display: block; flex: none; }
#__dsh_picker_fab__ .dsh-picker-label {
  max-width: 0;
  margin-left: 0;
  overflow: hidden;
  white-space: nowrap;
  opacity: 0;
  transition: max-width .24s cubic-bezier(.2,.8,.2,1), opacity .16s ease, margin-left .24s cubic-bezier(.2,.8,.2,1);
}
#__dsh_picker_fab__:hover .dsh-picker-label,
#__dsh_picker_fab__.is-active .dsh-picker-label,
#__dsh_picker_fab__.is-teaser .dsh-picker-label {
  max-width: 110px;
  margin-left: 7px;
  opacity: 1;
}
#__dsh_picker_fab__.is-active {
  opacity: 1;
  color: #1d4ed8;
  border-color: rgba(37, 99, 235, .28);
  background: rgba(239, 246, 255, .9);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, .08), 0 8px 22px -8px rgba(37, 99, 235, .45);
}
@media (prefers-color-scheme: dark) {
  #__dsh_picker_fab__ {
    border-color: rgba(255, 255, 255, .10);
    background: rgba(17, 24, 39, .72);
    color: rgba(226, 232, 240, .72);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -8px rgba(0, 0, 0, .6);
  }
  #__dsh_picker_fab__.is-active {
    color: #93c5fd;
    background: rgba(30, 58, 138, .62);
    border-color: rgba(147, 197, 253, .3);
  }
}
@media (prefers-reduced-motion: reduce) {
  #__dsh_picker_fab__, #__dsh_picker_fab__ .dsh-picker-label { transition: none; }
}

#__dsh_picker_fab__.is-hover{opacity:1;transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 14px 32px -10px rgba(15,23,42,.28)}
#__dsh_picker_fab__.is-hover .dsh-picker-label{max-width:110px;margin-left:7px;opacity:1}
</style></head><body>
<div class="stage">
  <div class="cell"><div class="wrap"><button id="__dsh_picker_fab__" type="button">    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.6 8.6V6.3c0-.94.76-1.7 1.7-1.7h2.3M15.4 4.6h2.3c.94 0 1.7.76 1.7 1.7v2.3M19.4 15.4v2.3c0 .94-.76 1.7-1.7 1.7h-2.3M8.6 19.4H6.3c-.94 0-1.7-.76-1.7-1.7v-2.3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/></svg><span class="dsh-picker-label">选取控件</span></button></div><div class="cap">默认（静止）</div></div>
  <div class="cell"><div class="wrap"><button id="__dsh_picker_fab__" class="is-hover" type="button">    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.6 8.6V6.3c0-.94.76-1.7 1.7-1.7h2.3M15.4 4.6h2.3c.94 0 1.7.76 1.7 1.7v2.3M19.4 15.4v2.3c0 .94-.76 1.7-1.7 1.7h-2.3M8.6 19.4H6.3c-.94 0-1.7-.76-1.7-1.7v-2.3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/></svg><span class="dsh-picker-label">选取控件</span></button></div><div class="cap">悬停（展开）</div></div>
  <div class="cell"><div class="wrap"><button id="__dsh_picker_fab__" class="is-active" type="button">    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.6 8.6V6.3c0-.94.76-1.7 1.7-1.7h2.3M15.4 4.6h2.3c.94 0 1.7.76 1.7 1.7v2.3M19.4 15.4v2.3c0 .94-.76 1.7-1.7 1.7h-2.3M8.6 19.4H6.3c-.94 0-1.7-.76-1.7-1.7v-2.3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/></svg><span class="dsh-picker-label">Esc 退出</span></button></div><div class="cap">拾取中</div></div>
</div>
</body></html>
